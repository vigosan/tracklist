[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracklist"
version = "0.1.0"
description = "Genera un tracklist con timestamps a partir de las reclamaciones de Content ID de YouTube"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "shazamio==0.4.0.1",
    "audioop-lts",
    "textual",
]

[project.scripts]
tracklist = "tracklist:main"

[tool.setuptools]
py-modules = ["messages", "tracklist", "upload", "recognize_ui", "recognize_tui"]
